<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="駅をサイコロで巡り、目的地への一番乗りと物件の独占を競うオリジナル鉄道すごろく">
<meta name="theme-color" content="#0C8565">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大人の鉄道すごろく">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>大人の鉄道すごろく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one-screen game — route map (scrollable, zoomable) beside a control column; stacks map-over-controls on phones */
:root{
  --bg:#E4EAEE; --panel:#FFFFFF; --ink:#18212B; --muted:#5A6977; --line:#C6D1D9;
  --land:#F2F5F1; --rail:#2B3540; --plus:#2C6BE0; --minus:#DE3F34; --card:#E5AC12;
  --accent:#0C8565; --accent-ink:#FFFFFF; --goal:#DE3F34; --pref:#8FA3B3; --yokai:#6B3FA0; --shop:#C2418F;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --panel:#17212A; --ink:#E6ECF1; --muted:#93A2AF; --line:#2B3946;
  --land:#131C24; --rail:#AFBECB; --plus:#5A93FF; --minus:#FF6A5C; --card:#F2C443;
  --accent:#2CC696; --accent-ink:#06261C; --goal:#FF6A5C; --pref:#3D4F5E; --yokai:#A77BE0; --shop:#F07CC0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --panel:#17212A; --ink:#E6ECF1; --muted:#93A2AF; --line:#2B3946;
  --land:#131C24; --rail:#AFBECB; --plus:#5A93FF; --minus:#FF6A5C; --card:#F2C443;
  --accent:#2CC696; --accent-ink:#06261C; --goal:#FF6A5C; --pref:#3D4F5E; --yokai:#A77BE0; --shop:#F07CC0; color-scheme:dark}
[hidden]{display:none!important}
.fm-tools{display:flex;gap:6px;margin-bottom:8px}.fm-tools select{flex:1}
.fm-wrap{overflow:auto;max-height:min(52vh,560px);border:1px solid var(--line);border-radius:10px;background:var(--land);-webkit-overflow-scrolling:touch}
.fm-wrap svg{display:block;cursor:pointer}
.fm-ring{fill:color-mix(in srgb,var(--accent) 25%,transparent);stroke:var(--accent);stroke-width:6;pointer-events:none}
.sheet .fm-name{font-family:var(--f-display);font-weight:400;font-size:20px;margin:14px 0 4px}
.fm-tab td,.fm-tab th{font-size:13px;white-space:nowrap}.fm-tab td:first-child{white-space:normal;min-width:8em}.fm-tab td:last-child{white-space:normal}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);padding-inline:16px;padding-block:10px;gap:10px;box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;letter-spacing:.02em;text-wrap:balance}
.when{font-family:var(--f-display);font-size:15px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums}
.goal{display:flex;align-items:center;gap:6px;background:var(--goal);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700}
.goal b{font-family:var(--f-display);font-weight:400;font-size:15px}
.spacer{flex:1}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px;min-height:0}
#mapWrap{position:relative;overflow:auto;background:var(--land);border:1px solid var(--line);border-radius:12px;min-height:0;-webkit-overflow-scrolling:touch}
#map{display:block;margin:0 auto}
.zoom{position:sticky;float:right;top:8px;right:8px;margin:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
aside{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 8px}
.pl{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:7px 8px;border-radius:8px}
.pl.on{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:2px solid var(--accent)}
.dot{width:14px;height:14px;border-radius:50%}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm small{font-weight:400;color:var(--muted);margin-left:4px}
.pl .mo{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.pl .mo.neg{color:var(--minus)}
.pl .sub{grid-column:2/4;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:4px}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;cursor:pointer}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--minus);color:var(--minus)}
.btn.big{width:100%;font-family:var(--f-display);font-weight:400;font-size:20px;padding:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.zoom button:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dice{display:flex;gap:8px;justify-content:center;min-height:56px;align-items:center;margin-bottom:10px}
.die{width:52px;height:52px;border-radius:12px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-family:var(--f-display);font-size:28px}
.hint{color:var(--muted);margin:0 0 10px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel);color:var(--ink);cursor:pointer}
.chip .sq{width:10px;height:10px;border-radius:50%}
.chip small{color:var(--muted)}
.cards{margin-top:12px}
.cardbtn{font:inherit;text-align:left;width:100%;display:flex;justify-content:space-between;gap:8px;border:1px dashed var(--card);background:color-mix(in srgb,var(--card) 12%,transparent);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;margin-top:6px}
.cardbtn small{color:var(--muted)}
#log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.5}
#log li{color:var(--muted)}#log li:first-child{color:var(--ink)}
#modal{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--panel);color:var(--ink);border-radius:16px;width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;border:1px solid var(--line)}
.sheet.wide{width:min(600px,100%)}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 12px;text-wrap:balance}
.sheet h3{font-size:14px;margin:18px 0 8px}
.sheet p{line-height:1.7;margin:0 0 10px}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row .pn{font-weight:700;min-width:0}
.row .pp{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.own{font-size:12px;padding:3px 8px;border-radius:999px;color:#fff;font-weight:700;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:13px}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
.prow{display:grid;grid-template-columns:14px minmax(0,1fr) 108px;gap:8px;align-items:center;margin-bottom:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;line-height:1.5}
.check input{width:18px;height:18px;margin-top:2px;flex:none}
.check small{display:block;color:var(--muted)}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.slot b{display:block}
.slot small{color:var(--muted);font-size:12px}
.ed-head,.ed-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 64px 38px;gap:6px;align-items:center}
.ed-head{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
.ed-row{margin-bottom:6px}
.ed-row input{width:100%;padding:7px 8px}
.ed-row input.bad{border-color:var(--minus);outline:2px solid var(--minus)}
.ed-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.err{color:var(--minus);font-weight:700;min-height:1.2em;margin:8px 0 0}
.big-money{font-family:var(--f-display);font-size:30px;color:var(--accent);margin:4px 0 8px}
.vol{display:flex;gap:10px;align-items:center;padding:8px 0}
.vol input{flex:1;padding:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:12px;color:var(--muted)}
.settle td{white-space:nowrap;font-size:13px}.settle td:first-child{white-space:normal}
#msgLayer{position:fixed;inset:0;z-index:15;cursor:pointer}
@keyframes bob{50%{transform:translateY(3px)}}
.qgenre{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;margin-bottom:8px}
.qreward{font-size:13px;color:var(--muted);margin:0 0 12px}
.qopts{display:grid;gap:8px}
.qopt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.5}
.qopt.ok{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);font-weight:700}
.qopt.ng{border:2px solid var(--minus);background:color-mix(in srgb,var(--minus) 12%,transparent)}
.qopt:disabled{cursor:default;opacity:1}
.qres{font-weight:700;margin:12px 0 0;font-size:16px}
body[data-wait] #action button,body[data-wait] #action .cardbtn{pointer-events:none;opacity:.5}
.cer-title{font-family:var(--f-display);font-weight:400;font-size:32px;text-align:center}
.cer-rank{font-family:var(--f-display);font-size:34px;text-align:center;margin:2px 0}
.cer-rank.r1{color:var(--card)}.cer-rank.r2{color:var(--muted)}.cer-rank.r3{color:#B5743D}.cer-rank.r4{color:var(--muted)}
.cer-rank.arr{font-size:26px}
.tag.ttl{background:color-mix(in srgb,var(--card) 22%,transparent);border-color:var(--card);color:var(--ink)}
.tag.ttl.t4,.tag.ttl.t5{background:var(--card);color:#2B3540}
.ladder{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin:10px 0 4px;font-size:13px}
.ladder span{border:1.5px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.ladder span.done{color:var(--ink);border-color:var(--card)}
.ladder span.on{background:var(--card);border-color:var(--card);color:#2B3540;font-weight:700}
.ladder i{color:var(--muted);font-style:normal}
.cer-name{text-align:center;display:flex;gap:8px;justify-content:center;align-items:center}
.cer-line{text-align:center;font-weight:700;line-height:1.7}
.big-money{text-align:center}.big-money.neg{color:var(--minus)}
.awards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.award{border:2px solid var(--card);background:color-mix(in srgb,var(--card) 15%,transparent);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.ach{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;opacity:.6}
.ach.got{opacity:1;border-color:var(--card);background:color-mix(in srgb,var(--card) 10%,transparent)}
.ach small{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tab{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dex{display:flex;flex-wrap:wrap;gap:5px}
.dexst{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.dexst.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.dexrow{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.dexrow>span{display:flex;flex-wrap:wrap;gap:4px}
.dp{padding:1px 7px;border-radius:6px;border:1px dashed var(--line);color:var(--muted)}
.dp.on{border-style:solid;border-color:var(--accent);color:var(--ink)}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart-tip{position:absolute;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.6;box-shadow:0 4px 14px color-mix(in srgb,#000 18%,transparent);pointer-events:none;white-space:nowrap}
.stat-wrap{overflow-x:auto}
.stat td,.stat th{white-space:nowrap;font-size:13px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-16px;height:14px;border-radius:2px;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(760deg)}}
.qex{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--bg);line-height:1.7;font-size:14px}
.roulette{font-family:var(--f-display);font-size:clamp(28px,8vw,44px);text-align:center;padding:18px 8px;border:3px dashed var(--goal);border-radius:14px;margin:4px 0 12px}
.roulette.hit{color:var(--goal);border-style:solid;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.sq-shop{fill:var(--shop)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
/* svg */
.rail{fill:none;stroke:var(--rail);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.ferry{fill:none;stroke:var(--plus);stroke-width:4;stroke-dasharray:10 9}
.ferry.long{stroke-width:5;stroke-dasharray:14 10}
.tunnel{fill:none;stroke:var(--rail);stroke-width:7;stroke-dasharray:16 9;stroke-linecap:round;opacity:.7}
.note{font-family:var(--f-body);font-weight:700;font-size:18px;fill:var(--plus);paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.sq-plus{fill:var(--plus)}.sq-minus{fill:var(--minus)}.sq-card{fill:var(--card)}
.sqo{stroke:var(--land);stroke-width:3}
.st{fill:var(--panel);stroke:var(--rail);stroke-width:4}
.stl{font-family:var(--f-body);font-weight:700;font-size:17px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.pref{font-family:var(--f-display);fill:var(--pref);opacity:.35}
.odot{stroke:none}
.goalring{fill:none;stroke:var(--goal);stroke-width:5;animation:pulse 1.4s ease-in-out infinite}
.goalflag{fill:var(--goal)}
@keyframes pulse{50%{stroke-width:9;opacity:.55}}
.cand{fill:color-mix(in srgb,var(--accent) 30%,transparent);stroke:var(--accent);stroke-width:4;cursor:pointer}
.tok{transition:transform .13s linear}
.tokc{stroke:var(--panel);stroke-width:3;stroke-linejoin:round}
.tokout{fill:none;stroke:var(--ink);stroke-width:7;stroke-linejoin:round;opacity:.55}
.tokt{font-family:var(--f-display);font-size:13px;fill:#fff;text-anchor:middle;pointer-events:none}
.pint{font-size:19px}
.tok .tokin{transition:transform .2s}
.tok.cur .tokin{transform:scale(1.28)}
.tokring{fill:none;stroke:var(--card);stroke-width:5;opacity:0}
.tok.cur .tokring{animation:ring 1.3s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.95}50%{opacity:.25}}
.yok{fill:var(--yokai);stroke:var(--panel);stroke-width:2.5}
.yokt{font-size:11px}
.tag.yk{color:var(--yokai);border-color:var(--yokai)}
.tag.bad{color:var(--minus);border-color:var(--minus)}
.cardbtn.atk{border-color:var(--minus);background:color-mix(in srgb,var(--minus) 10%,transparent)}
#statusBar{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;min-height:34px}
#statusBar:empty{display:none}
.hs{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;border-radius:6px}.hs.on{outline:2px solid var(--accent);outline-offset:2px}.hs .tag{margin-left:0}
#statusBar .sb-money{font-weight:700;font-variant-numeric:tabular-nums}
#statusBar .sb-money.neg{color:var(--minus)}
#statusBar .sb-dist{color:var(--muted)}
#menuBtn{display:none}
/* events box with scene art */
#log{display:flex;flex-direction:column;gap:8px}
#log.active{outline:3px solid var(--accent);outline-offset:-1px}
.scene,.scene-pic{border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--bg)}
.scene svg,.scene img,.scene-pic svg,.scene-pic img{display:block;width:100%;height:100%;object-fit:cover}
.scene-pic{margin:-4px 0 12px;max-height:200px;width:100%}
.scene-text{margin:0;font-size:16px;font-weight:700;line-height:1.6;min-height:1.6em}
.scene-hint{margin:0;text-align:right;font-size:12px;color:var(--muted);min-height:1em}
.scene-hint.tap::after{content:" ▼";display:inline-block;animation:bob 1s ease-in-out infinite}
.loglabel{margin:4px 0 0}
.menu{display:grid;gap:8px}
.menu .btn{width:100%;padding:13px;font-size:15px}
/* title screen */
#title{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:16px}
.t-inner{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;text-align:center;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.t-visual{border-radius:16px;overflow:hidden;aspect-ratio:16/9;border:3px solid var(--ink)}
.t-visual svg,.t-visual img{display:block;width:100%;height:100%;object-fit:cover}
.t-logo{font-family:var(--f-display);font-size:clamp(34px,10vw,56px);line-height:1.15;margin:4px 0 0;letter-spacing:.02em;text-wrap:balance}
.t-logo span{display:block;font-size:.45em;color:var(--accent);letter-spacing:.3em}
.t-sub{display:inline-block;margin:0 auto;font-family:var(--f-display);font-size:20px;background:var(--goal);color:#fff;padding:4px 18px;border-radius:999px}
.t-btns{display:grid;gap:10px}
.t-btns .btn{width:100%}
.t-cont small,.t-btns .btn small{display:block;font-family:var(--f-body);font-size:12px;opacity:.8;margin-top:2px}
.t-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t-row .btn{padding:10px 4px}
.t-note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
@media (max-width:820px){
  body{gap:6px;padding-block:6px}
  header{gap:6px}
  header h1{display:none}
  .when{font-size:13px;padding:3px 8px}
  .goal{padding:3px 8px;font-size:13px}
  .goal b{font-size:13px}
  .hbtns .btn{padding:6px 9px;font-size:12px}
  .hbtns .btn:not(#sndBtn):not(#menuBtn){display:none}
  #menuBtn{display:inline-block}
  .layout{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
  #mapWrap,#action,#log{min-width:0;width:100%}
  aside{display:contents}
  #playersBox{display:none}
  #mapWrap{flex:1 1 auto;min-height:0}
  #action,#log{flex:0 0 auto;padding:10px}
  .btn.big{padding:12px;font-size:19px}
  body[data-view="roll"] #mapWrap{display:none}
  body[data-view="roll"] #action{order:1}
  body[data-view="roll"] #log{order:2;flex:1 1 auto;min-height:0;overflow:auto}
  body[data-view="roll"] .scene{max-height:24vh;width:100%}
  body[data-view="map"] #mapWrap{order:1}
  body[data-view="map"] #log{order:2}
  body[data-view="map"] #action{order:3;max-height:34vh;overflow:auto}
  body[data-view="map"]:not([data-phase="choose"]) #action{display:none}
  body[data-view="cpu"] #log{order:1}
  body[data-view="cpu"] #mapWrap{order:2}
  body[data-view="cpu"] #action{display:none}
  body[data-view="map"] #log,body[data-view="cpu"] #log{display:grid;grid-template-columns:40% 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:start}
  body[data-view="map"] #log .scene,body[data-view="cpu"] #log .scene{grid-row:1/3}
  body[data-view="map"] #log .scene-text,body[data-view="cpu"] #log .scene-text{font-size:14px;align-self:center}
  body[data-view="map"] #log .loglabel,body[data-view="map"] #log ol,body[data-view="cpu"] #log .loglabel,body[data-view="cpu"] #log ol{display:none}
}

<header>

    <button class="btn sm" id="setBtn">設定・音</button>
    <button class="btn sm" id="howBtn">遊び方</button>
    <button class="btn sm" id="newBtn">タイトルへ</button>
    <button class="btn sm" id="menuBtn">メニュー</button>
  </div>
</header>
<div id="statusBar"></div>
<div class="layout">

  </div>

    <section class="box" id="action"><p class="hint">読み込み中…</p></section>

  </aside>
</div>
<div id="title" hidden>

  let prev=a;const pts=[a];
  for(let i=1;i<=k;i++){const r=srand(),id="m"+ei+"_"+i,[x,y]=at(i/(k+1));
    const type=kind===1?(r<.5?"plus":"card"):kind===2?(r<.6?"minus":r<.8?"card":"plus"):(r<.5?"plus":r<.78?"minus":"card");
    addNode(id,{id,type,x,y,sea:kind===2?(meta&&meta.winter?"js":"pac"):null});link(prev,id);prev=id;pts.push(id)}

}

  N={};ADJ={};RAILS=[];distCache={};let seed=20261010;const srand=()=>(seed=(seed*16807)%2147483647)/2147483647;
  STATIONS.forEach(([n,x,y,lp])=>addNode(n,{id:n,type:"st",x,y,lp}));
  const later=[];
  MAP.edges.forEach((e,ei)=>{const[a,b,kind=0]=e;if(kind===2){later.push([e,ei]);return}
    const A=N[a],B=N[b],d=Math.hypot(A.x-B.x,A.y-B.y);addChain(a,b,[[A.x,A.y],[B.x,B.y]],Math.max(1,Math.round(d/66)),ei,kind,srand)});

  const lands=later.map(([[a,b]])=>bfs(a)[b]||20);
  later.forEach(([[a,b,kind,wp,meta],ei],li)=>{const pts=[[N[a].x,N[a].y],...(wp||[]).map(([lo,la])=>LL(lo,la)),[N[b].x,N[b].y]];
    addChain(a,b,pts,Math.max(4,Math.round(lands[li]*.75)),ei,kind,srand,meta)});
  MAP.shops.forEach(([a,b])=>{const r=RAILS.find(r=>(r.pts[0]===a&&r.pts.at(-1)===b)||(r.pts[0]===b&&r.pts.at(-1)===a));if(r)N[r.pts[Math.floor(r.pts.length/2)]].type="shop"});
}

function reach(start,steps,dest,exact){
  const res=new Map(),seen=new Set();
  (function go(u,p,left,path){
    const key=u+"|"+p+"|"+left;if(seen.has(key))return;seen.add(key);
    if(!exact&&u===dest&&path.length>1){if(!res.has(u))res.set(u,path.slice());return}
    if(left===0){if(!res.has(u))res.set(u,path.slice());return}
    let nb=ADJ[u].filter(v=>v!==p);if(!nb.length)nb=ADJ[u];
    for(const v of nb){path.push(v);go(v,u,left-1,path);path.pop()}

}

/* CPU personalities: aggressive borrows to expand, cautious never borrows */
const STYLE={aggressive:{reserve:1000,margin:1,maxDebt:.5,repayAbove:30000},normal:{reserve:2500,margin:3,maxDebt:.3,repayAbove:15000},cautious:{reserve:4000,margin:99,maxDebt:0,repayAbove:5000}};

  ["狸の大親友",i=>ST(S.players[i]).yokaiTurns],["健脚賞",i=>ST(S.players[i]).steps],["青マスの申し子",i=>ST(S.players[i]).plus],["赤マスの常連",i=>ST(S.players[i]).minus],["災難の主人公",i=>ST(S.players[i]).bad]];
function computeAwards(){const res=S.players.map(()=>[]);

function ceremonyLine(x,first,last,order){const p=x.p,s=ST(p);

function chartSVG(){const H=S.hist||[];if(H.length<2)return "";const W=640,Ht=280,ml=52,mr=96,mt=14,mb=30;

  const X=i=>ml+(W-ml-mr)*i/(H.length-1),Y=v=>mt+(Ht-mt-mb)*(1-(v-mn)/(mx-mn));
  let g="";for(let v=mn;v<=mx+1;v+=st)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${yShort(v)}</text>`;

    return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="${DASH[pi%4]}"/>${marker(X(H.length-1),Y(H.at(-1).v[pi]),pi%4,c)}<text x="${W-mr+10}" y="${ly+4}" font-size="12" font-weight="700" fill="var(--ink)">${esc(p.name.slice(0,6))}</text>`}).join("");

    const tip=$("#chTip");tip.hidden=false;tip.innerHTML=`<b>${esc(H[i].l)}</b>`+S.players.map((p,pi)=>`<div><span class="dot" style="background:${pcol(pi)};display:inline-block;margin-right:4px"></span>${esc(p.name)}　${yen(H[i].v[pi])}</div>`).join("");

async function howTo(){await modal(`<h2>遊び方</h2>
  <h3>目的</h3><p>決められた年数のあいだ駅をめぐり、最後に総資産（お金＋物件の価値）がいちばん多いオーナーの勝ちです。</p>
  <h3>進み方</h3><p>自分の番にサイコロを振り、地図で光るマスから止まる場所を選びます。目的地にぴったり止まると援助金がもらえ、ルーレットで次の目的地が決まります。</p>
  <h3>マス</h3><p><b style="color:var(--plus)">青</b>はお金が入り、<b style="color:var(--minus)">赤</b>は出費です。冬の北国では大雪で出費が増えます。<b style="color:var(--card)">黄</b>はカードがもらえますが、ときどき災難カード（鈍行・運休・罰金・紛失）を引きます。<b style="color:var(--shop)">ピンクのひし形</b>はカード売り場です。駅では物件を買えます。駅の物件をすべて持つと独占になり、毎年3月の決算で収益が2倍になります。</p>
  <h3>カード</h3><p>急行・特急・ぶっとびなどの移動カードのほか、相手を1回休みにする足止め、サイコロを半分にする鈍行押し付け、カード強奪、ぶっとばし、妖怪なすりつけといった邪魔カードがあります。お守りカードを持っていると、邪魔カードを1回防げます。</p>
  <h3>妖怪とクイズ</h3><p>誰かが目的地に着くと、いちばん遠いオーナーに妖怪「${YOKAI[0].n}」が取り憑きます。ほかのオーナーのいるマスを通れば押し付けられます。駅ではときどき4択クイズが出て、正解すると特典があります。</p>
  <h3>お金と物件</h3><p>決算は9月（中間）と3月（本決算）の年2回で、物件の収益が入ります。3月には物件評価額の1.4%の固定資産税がかかります。毎月ときどき経済ニュースが流れ、持っている物件の種類（飲食・宿泊・工場・農園漁業・観光・スキー場・夜の街・金融学術）によって臨時収入や損失が出ます。夏・秋・冬には季節のボーナスもあります。銀行では物件評価額の半分までお金を借りられますが、決算ごとに利息がかかります。総資産は「現金＋物件の評価額−借入残高」です。</p>
  <h3>称号</h3><p>総資産が増えると称号が上がり、そのたびに昇格ボーナス（クイズ正解の賞金と同じくらい）がもらえます。CPUも同じです。駆け出し → 小金持ち（2億円）→ 資産家（4億円）→ 大地主（8億円）→ 大富豪（15億円）→ 億万長者（30億円）。一度上がった称号は、総資産が減っても下がりません。</p>
  <h3>航路とトンネル</h3><p>東日本編には、大洗―苫小牧と新潟―小樽のフェリー航路があります。陸路より少し近いかわりに物件がなく、赤マスが多めです。冬の日本海航路は荒れて出費が増えます。</p>
  <p class="hint">物件・イベント・キャラクター・クイズの内容はすべて架空またはゲーム用の創作で、実在の企業・店舗とは関係ありません。</p>`,[["閉じる",0,"primary"]])}

  let sel=start||cp().pos,z=1;if(!STATIONS.some(s=>s[0]===sel))sel=S.dest;
  const pr=modal(`<h2>全体マップ</h2><p class="hint" style="margin-bottom:6px">駅をタップすると、その駅の物件が見られます。</p>
    <div class="fm-tools"><select id="fmSel" aria-label="駅を選ぶ">${STATIONS.map(s=>`<option ${s[0]===sel?"selected":""}>${s[0]}</option>`).join("")}</select><button class="btn sm" id="fmOut" aria-label="縮小">－</button><button class="btn sm" id="fmIn" aria-label="拡大">＋</button></div>
    <div class="fm-wrap" id="fmWrap"></div><div id="fmInfo"></div>`,[["閉じる",0,"primary"]],true);
  const wrap=$("#fmWrap"),svg=$("#map").cloneNode(true);svg.removeAttribute("id");svg.querySelectorAll(".cand").forEach(e=>e.remove());svg.querySelectorAll(".tok").forEach(t=>t.style.transition="none");wrap.appendChild(svg);

  const center=()=>{const n=N[sel],sc=svg.clientWidth/VW;wrap.scrollTo({left:n.x*sc-wrap.clientWidth/2,top:n.y*sc-wrap.clientHeight/2})};
  const info=()=>{const n=N[sel];ring.setAttribute("cx",n.x);ring.setAttribute("cy",n.y);$("#fmSel").value=sel;
    const own=S.owners[sel],props=P(sel),mono=own.length&&own.every(o=>o!=null&&o===own[0]);const d=distTo(S.dest)[sel];
    const here=S.players.filter(p=>p.pos===sel).map(p=>esc(p.name)).join("・");

      <p class="hint" style="margin:0 0 6px">${sel===S.dest?"いまの目的地です。":`目的地（${esc(S.dest)}）まで${d}マス。`}${here?`いまここにいる：${here}`:""}</p>
      <div class="stat-wrap"><table class="fm-tab"><tr><th>物件</th><th>価格</th><th>利回り</th><th>持ち主</th></tr>${props.map((pp,k)=>{const o=own[k];return `<tr><td>${esc(pp[0])}<br><small style="color:var(--muted)">${CAT_NAME[propCat(pp[0])]}</small></td><td>${yen(pp[1])}</td><td>${pp[2]}%</td><td>${o==null?'<span style="color:var(--muted)">空き</span>':`<span class="dot" style="background:${pcol(o)};display:inline-block;vertical-align:middle;margin-right:4px"></span>${esc(S.players[o].name)}`}</td></tr>`}).join("")}</table></div>`};
  size();info();requestAnimationFrame(center);
  svg.addEventListener("click",e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    let best=null,bd=1e9;STATIONS.forEach(([n,x,y])=>{const dd=(x-q.x)**2+(y-q.y)**2;if(dd<bd){bd=dd;best=n}});if(bd<75*75){sel=best;info();Snd.sfx("click")}});
  $("#fmSel").onchange=e=>{sel=e.target.value;info();center()};

    ${[1,2,3].map(i=>{const s=slots[i-1];const info=s?`${MAPS[s.map||"kanto"].name}・${s.year}年目 ${MONTHS[s.month]}・${s.players.map(x=>esc(x.name)).join("、")}`:"空き";const when=s&&s.savedAt?new Date(s.savedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";

    <div class="btns" style="justify-content:flex-start;margin:0 0 8px"><button class="btn sm" data-code ${canSave?"":"disabled"}>今の状態をコードにする</button>${codeOut?`<button class="btn sm" data-copy>コピー</button>`:""}</div>
    ${codeOut?`<textarea id="codeOut" rows="3" readonly>${codeOut}</textarea>`:""}
    <div class="field" style="margin-top:12px"><label for="codeIn">コードから再開</label><textarea id="codeIn" rows="3" placeholder="KKS2Z: から始まるコードを貼り付け"></textarea></div>

  draw();
  body.onclick=async e=>{const t=e.target.closest("button");if(!t)return;
    if(t.dataset.save){const i=+t.dataset.save;if(slots[i-1]&&armed!==i){armed=i;draw();return}
      const snap=clone(S);snap.savedAt=Date.now();slots[i-1]=snap;armed=null;await Store.set("slot"+i,snap);Snd.sfx("buy");draw();toast(`スロット${i}にセーブしました`)}
    else if(t.dataset.load){const s=slots[+t.dataset.load-1];$("#modal").hidden=true;toast(`スロット${t.dataset.load}をロードしました`);resume(clone(s))}
    else if("code"in t.dataset){codeOut=await encodeState(S);draw()}
    else if("copy"in t.dataset){const ta=$("#codeOut");try{await navigator.clipboard.writeText(codeOut);toast("コピーしました")}catch(err){ta.focus();ta.select();toast("選択しました。コピーしてください")}}

    const bad=!n.trim()?[0,"物件名を入力してください。"]:!(Number.isInteger(+pr)&&+pr>=10&&+pr<=9999990)?[1,"価格は10〜9,999,990万円の整数で入力してください。"]:!(Number.isInteger(+rt)&&+rt>=1&&+rt<=50)?[2,"収益率は1〜50%の整数で入力してください。"]:null;

    const out={};for(const s of ALL_ST){const st=s[0],arr=draft[st].map(([n,p,r])=>[n.trim().slice(0,16),+p,+r]);if(JSON.stringify(arr)!==JSON.stringify(DEFAULT_PROPS[st]))out[st]=arr}
    CUSTOM=out;await Store.set("props",out);toast("物件を保存しました。次のゲームから反映されます");return true};
  const p=modal("",[["キャンセル",0],["保存する",1,"primary",save]],true);
  const draw=()=>{const list=draft[cur];const changed=Object.keys(CUSTOM).length;
    body.innerHTML=`<h2>物件の編集</h2><p class="hint">変更は次に始めるゲームから反映されます。進行中のゲームとセーブデータはそのままです。${changed?`現在${changed}駅をカスタマイズ中です。`:""}</p>
    <div class="field"><label for="edSt">駅を選ぶ</label><select id="edSt">${ALL_ST.map(s=>`<option value="${s[0]}" ${s[0]===cur?"selected":""}>${s[0]}${JSON.stringify(draft[s[0]].map(([n,p,r])=>[n,+p,+r]))!==JSON.stringify(DEFAULT_PROPS[s[0]])?"（変更あり）":""}</option>`).join("")}</select></div>
    <div class="ed-head"><span>物件名</span><span>価格（万円）</span><span>収益率%</span><span></span></div>
    ${list.map((pr,i)=>`<div class="ed-row"><input id="edN${i}" data-i="${i}" data-k="0" value="${esc(pr[0])}" maxlength="16" aria-label="${i+1}件目の物件名"><input id="edP${i}" data-i="${i}" data-k="1" type="number" inputmode="numeric" min="10" step="10" value="${esc(pr[1])}" aria-label="${i+1}件目の価格"><input id="edR${i}" data-i="${i}" data-k="2" type="number" inputmode="numeric" min="1" max="50" value="${esc(pr[2])}" aria-label="${i+1}件目の収益率"><button class="btn sm" data-del="${i}" ${list.length<=1?"disabled":""} aria-label="${i+1}件目を削除">✕</button></div>`).join("")}
    <div class="ed-tools"><button class="btn sm" data-add ${list.length>=6?"disabled":""}>＋ 物件を追加</button><button class="btn sm" data-reset>この駅を初期値に戻す</button><button class="btn sm ${armAll?"danger":""}" data-resetall>${armAll?"本当に全駅を戻す":"全駅を初期値に戻す"}</button></div>
    <p class="hint" style="margin-top:10px">1駅に最大6件まで。収益率は毎年3月の決算で入る額の割合で、駅を独占すると2倍になります。</p><p class="err" id="edErr"></p>`};
  draw();
  body.oninput=e=>{const t=e.target;if(t.dataset.k!=null){draft[cur][+t.dataset.i][+t.dataset.k]=t.value;t.classList.remove("bad")}};
  body.onchange=e=>{if(e.target.id==="edSt"){cur=e.target.value;armAll=false;draw()}};
  body.onclick=e=>{const t=e.target.closest("button");if(!t)return;
    if(t.dataset.del!=null){draft[cur].splice(+t.dataset.del,1);draw()}
    else if("add"in t.dataset){draft[cur].push(["新しい物件","1000","8"]);draw();const i=draft[cur].length-1;const x=$("#edN"+i);x&&(x.focus(),x.select())}
    else if("reset"in t.dataset){draft[cur]=clone(DEFAULT_PROPS[cur]).map(p=>p.map(String));draw()}
    else if("resetall"in t.dataset){if(!armAll){armAll=true;draw();return}ALL_ST.forEach(s=>draft[s[0]]=clone(DEFAULT_PROPS[s[0]]).map(p=>p.map(String)));armAll=false;draw();$("#edErr").textContent="";toast("全駅を初期値に戻しました。保存すると確定します")}};
  await p;
}

/* ---------- settings ---------- */
async function openSettings(){Snd.unlock();const body=$("#modalBody");
  const p=modal(`<h2>設定</h2>
  <h3>メッセージの進み方</h3>
  <div class="field"><label for="sSpeed">表示の速さ</label><select id="sSpeed">${Object.entries(SPEEDS).map(([k,v])=>`<option value="${k}" ${GP.speed===k?"selected":""}>${v.n}</option>`).join("")}</select></div>
  <p class="hint">「タップで進む」にすると、CPUの番も含めてメッセージはタップするまで止まります。ほかの速さでは、メッセージは時間がたつと自動で進みます（タップでの早送りはしません）。</p>
  <h3>サウンド</h3>
  <label class="check"><input type="checkbox" id="sOn" ${Snd.prefs.on?"checked":""}><span>音を出す<small>オフにするとBGMも効果音も止まります。iPhoneでは消音モードでも鳴るようにしています。</small></span></label>
  <label class="check"><input type="checkbox" id="sBgm" ${Snd.prefs.bgm?"checked":""}><span>BGM<small>ゲームのために作ったオリジナル曲です。</small></span></label>
  <label class="check"><input type="checkbox" id="sSe" ${Snd.prefs.se?"checked":""}><span>効果音<small>サイコロ、移動、マス、購入、到着、決算の音です。</small></span></label>
  <div class="vol"><label for="sVol">音量</label><input type="range" id="sVol" min="0" max="1" step="0.05" value="${Snd.prefs.vol}"></div>
  ${S&&S.phase!=="over"?`<h3>このゲームのルール</h3><label class="check"><input type="checkbox" id="sAssist" ${S.assist?"checked":""}><span>追い上げサポート<small>総資産が最下位のオーナーは、大きい目が少し出やすくなります。オフのときサイコロは完全にランダムです。</small></span></label>
  <label class="check"><input type="checkbox" id="sExact" ${S.rules.exact?"checked":""}><span>ぴったり到着<small>目的地にはちょうどの目で止まったときだけ到着できます。</small></span></label>
  <label class="check"><input type="checkbox" id="sYokai" ${S.rules.yokai?"checked":""}><span>妖怪「${YOKAI[0].n}」<small>オフにすると、取り憑いている妖怪もいなくなります。</small></span></label>
  <label class="check"><input type="checkbox" id="sQuiz" ${S.rules.quiz?"checked":""}><span>4択クイズ<small>駅に止まると3回に1回ほど出題されます。</small></span></label>`:""}`,[["閉じる",0,"primary"]]);
  body.onchange=body.oninput=e=>{const t=e.target;if(t.type==="checkbox"&&e.type!=="change")return;
    if(t.id==="sOn"){Snd.prefs.on=t.checked;Snd.armed=true}else if(t.id==="sBgm")Snd.prefs.bgm=t.checked;else if(t.id==="sSe"){Snd.prefs.se=t.checked;Snd.sfx("click")}else if(t.id==="sVol")Snd.prefs.vol=+t.value;
    else if(t.id==="sAssist"&&e.type==="change"){S.assist=t.checked;log(`追い上げサポートを${S.assist?"オン":"オフ"}にしました。`);render();autosave()}
    else if(t.id==="sExact"&&e.type==="change"){S.rules.exact=t.checked;log(`ぴったり到着を${t.checked?"オン":"オフ"}にしました。`);render();autosave()}
    else if(t.id==="sSpeed"){GP.speed=t.value;saveGP()}
    else if(t.id==="sQuiz"&&e.type==="change"){S.rules.quiz=t.checked;log(`クイズを${t.checked?"オン":"オフ"}にしました。`);autosave()}
    else if(t.id==="sYokai"&&e.type==="change"){S.rules.yokai=t.checked;if(!t.checked)S.yokai={owner:null,form:0,turns:0};log(`妖怪を${t.checked?"オン":"オフ"}にしました。`);render();autosave()}
    Snd.savePrefs();Snd.apply();updSndBtn()};
  await p}

/* ---------- events ---------- */
$("#action").addEventListener("click",async e=>{if(!S||document.body.dataset.wait)return;const p=cp();
  const a=e.target.closest("[data-act]"),c=e.target.closest("[data-card]"),g=e.target.closest("[data-go]");
  if(a&&a.dataset.act==="roll"&&S.phase==="roll")humanRoll();
  else if(a&&a.dataset.act==="new")setup(S.mode);
  else if(a&&a.dataset.act==="stats")statsModal();
  else if(a&&a.dataset.act==="title")showTitle();
  else if(a&&a.dataset.act==="bank"&&S.phase==="roll"&&!usingCard){usingCard=true;await bankModal();usingCard=false;render()}
  else if(c&&S.phase==="roll"&&!usingCard){usingCard=true;const res=await useCard(p,+c.dataset.card);usingCard=false;if(res==="warp"){S.phase="busy";render();await land();await endTurn()}else render()}
  else if(g)choose(g.dataset.go)});
let usingCard=false;
const guard=fn=>()=>{if(modalOpen())return;if(busy()){toast("手番が終わるまでお待ちください");return}fn()};
$("#newBtn").onclick=guard(showTitle);
$("#saveBtn").onclick=guard(openSaves);
$("#mapBtn").onclick=guard(()=>fullMap());
$("#statsBtn").onclick=guard(()=>{if(S)statsModal()});
$("#editBtn").onclick=guard(openEditor);
$("#howBtn").onclick=()=>{if(!modalOpen())howTo()};
$("#menuBtn").onclick=()=>{if(!modalOpen())openMenu()};
$("#sndBtn").onclick=()=>{if(!Snd.wasRunning)Snd.prefs.on=true;else Snd.prefs.on=!Snd.prefs.on;Snd.savePrefs();Snd.apply();Snd.sfx("click");updSndBtn()};
$("#setBtn").onclick=()=>{if(!modalOpen())openSettings()};
$("#tSingle").onclick=()=>{if(!modalOpen())setup("single")};
$("#tMulti").onclick=()=>{if(!modalOpen())setup("multi")};
$("#tRec").onclick=()=>{if(!modalOpen())recordsModal()};
$("#tCont").onclick=async()=>{if(modalOpen())return;if(S&&S.phase!=="over"){hideTitle();render();return}const s=await Store.get("auto");if(s&&validState(s))resume(s)};
$("#tLoad").onclick=()=>{if(!modalOpen())openSaves()};
$("#tHow").onclick=()=>{if(!modalOpen())howTo()};
$("#tSet").onclick=()=>{if(!modalOpen())openSettings()};
$("#zin").onclick=()=>{scale=Math.min(3,Math.max(scale,baseW()/VW)*1.3);applyZoom();S&&focus(cp().pos,false)};
$("#zout").onclick=()=>{scale=Math.max(baseW()/VW,scale/1.3);applyZoom();S&&focus(cp().pos,false)};
$("#zme").onclick=()=>S&&focus(cp().pos);
addEventListener("resize",()=>{applyZoom()});

/* ---------- boot ---------- */
async function boot(data){Snd.loadPrefs();useMap(GP.map||"east");probeImages();$("#tVisual").innerHTML=artHTML("title");
  if(data&&data.S&&validState(data.S)){resume(data.S);Store.init().then(async()=>{CUSTOM=(await Store.get("props"))||{}});return}
  $("#title").hidden=false;setView();
  await Promise.race([Store.init(),sleep(4000)]);
  try{CUSTOM=(await Store.get("props"))||{}}catch(e){CUSTOM={}}
  await loadRec();showTitle()}
window.claude?.hot?.snapshot?.(()=>({S:S&&S.phase!=="over"?S:null}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

</body>
</html>
